---
- name: 'Set user name and email'
  git_config:
    scope: 'global'
    name: "user.{{ item.key }}"
    value: "{{ item.value }}"
  with_dict:
    name: 'Rafał Lewandowski'
    email: 'rafalowski@protonmail.com'

- name: 'Configure the pull strategy'
  git_config:
    scope: 'global'
    name: 'pull.rebase'
    value: 'true'

- name: 'Add git aliases'
  git_config:
    scope: 'global'
    name: "alias.{{ item.key }}"
    value: "{{ item.value }}"
  with_dict:
    ci: 'duet-commit -v'
    st: 'status'
    lol: "log --pretty=format:'%C(auto)%h %C(cyan)%ch %C(reset)%s'"
    fix: 'commit --amend --no-edit'
    difff: 'diff --cached'
    co: 'checkout'
